version: '3.8'

services:
  sathvika-postgres-db:
    image: postgres:15-alpine
    container_name: sathvika-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sathvika_db
    ports:
      - "5432:5432"
    volumes:
      - sathvika_pgdata:/var/lib/postgresql/data

  sathvika-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sathvika-api-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@sathvika-postgres-db:5432/sathvika_db?schema=public"
      JWT_SECRET: "sathvika-super-secret-jwt-token-2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      - sathvika-postgres-db

  sathvika-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sathvika-web-portal
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - sathvika-backend

volumes:
  sathvika_pgdata:
